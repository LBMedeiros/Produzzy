# Render Blueprint para o Produzzy.
#
# Uso:
#   - Deploy do zero: no painel do Render, "New +" > "Blueprint" e aponte para
#     este repositório. Ele cria o banco, a API e o site estático.
#   - Já tem serviços criados: NÃO precisa aplicar o blueprint inteiro. Basta
#     replicar manualmente, em cada serviço, as chaves `envVars`,
#     `healthCheckPath` e `preDeployCommand` abaixo (ver DEPLOY.md).
#
# Depois de subir, preencha no painel os valores marcados com `sync: false`
# (segredos) e confira o checklist em DEPLOY.md.

databases:
  - name: produzzy-db
    databaseName: produzzy
    plan: free
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # API (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: produzzy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Roda as migrations ANTES de trocar a versão em produção. Se falhar,
    # o deploy é abortado e a versão antiga continua no ar.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: produzzy-db
          property: connectionString
      - key: PRODUZZY_ENV
        value: production
      - key: PRODUZZY_SECRET_KEY
        generateValue: true          # chave forte gerada pelo Render
      - key: PRODUZZY_JWT_ALGORITHM
        value: HS256
      - key: PRODUZZY_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Origem EXATA do frontend (sem barra no final). Produção rejeita o
      # valor padrão e "*", então isto é obrigatório.
      - key: PRODUZZY_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: PRODUZZY_GOOGLE_CLIENT_ID
        sync: false
      - key: PRODUZZY_GOOGLE_CLIENT_SECRET
        sync: false
      - key: PRODUZZY_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: PRODUZZY_CLOUDINARY_API_KEY
        sync: false
      - key: PRODUZZY_CLOUDINARY_API_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend (SPA React + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: produzzy-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: toda rota volta pro index.html (necessário para /join/... e
    # /invites/.../accept, que são resolvidos no cliente).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false                  # URL pública da produzzy-api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
